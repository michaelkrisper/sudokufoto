name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu fonts-liberation fonts-freefont-ttf fonts-noto-core
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: |
          python3 -m http.server 8792 &
          npm run test:e2e -- http://localhost:8792/ e2e-screenshots
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
  deploy:
    needs: [check, version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp -r index.html style.css sw.js manifest.webmanifest js icons _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
  version:
    name: Version tag
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}
